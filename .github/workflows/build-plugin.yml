name: Qualify TE-2350 Windows release

on:
  push:
    branches: [main, master, 'codex/m13-*']
    paths: ['te2350-vst/**', 'src/**', 'include/**', 'LICENSE', '.github/workflows/build-plugin.yml']
  pull_request:
    paths: ['te2350-vst/**', 'src/**', 'include/**', 'LICENSE', '.github/workflows/build-plugin.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: te2350-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-release:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Clean checkout
        uses: actions/checkout@v4
      - name: Configure pinned JUCE, no dependency or build cache
        working-directory: te2350-vst
        run: cmake --preset windows-release
      - name: Build official product targets
        working-directory: te2350-vst
        run: cmake --build --preset windows-release --parallel 4
      - name: Qualification, ZIP packaging and final extracted VST3 validation
        working-directory: te2350-vst
        run: cmake --build --preset windows-package --parallel 4
      - name: Ensure the build did not modify source files
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { throw "Source tree changed during release: $status" }
      - name: Upload qualified distribution only
        uses: actions/upload-artifact@v4
        with:
          name: TE-2350-windows-x64
          if-no-files-found: error
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/*.sha256
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TE-2350-qualification-evidence
          if-no-files-found: warn
          path: |
            build/release-msvc/Testing/Temporary/*.log
            build/release-msvc/UIRenders/*.png
